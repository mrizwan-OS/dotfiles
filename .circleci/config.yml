# CircleCI configuration for dotfiles repository
version: 2.1

jobs:
  build:
    docker:
      - image: cimg/base:stable

    steps:
      - checkout

      - run:
          name: Verify repository structure
          command: |
            echo "Repository contents:"
            find . -not -path './.git/*' | sort
            echo ""
            echo "Confirming expected files exist..."
            test -f powershell/Microsoft.PowerShell_profile.ps1 && echo "PowerShell profile found." || (echo "ERROR: PowerShell profile missing." && exit 1)

workflows:
  sample:
    jobs:
      - build
